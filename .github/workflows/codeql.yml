name: "CodeQL Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 6 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    runs-on: [self-hosted, sast]

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # IMPORTANT
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      # Debugging step
      - name: Verify Python
        shell: powershell
        run: |
          where.exe python
          python --version
          echo $env:PATH

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
